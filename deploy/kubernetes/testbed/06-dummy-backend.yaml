apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummy-backend
  namespace: toron-test
  labels:
    app: dummy-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dummy-backend
  template:
    metadata:
      labels:
        app: dummy-backend
    spec:
      containers:
        - name: dummy-backend
          image: dummy-services:test
          imagePullPolicy: IfNotPresent
          command: ["/app/dummy"]
          args: ["-port", "9001", "-count", "1"]
          ports:
            - name: http
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /health
              port: 9001
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dummy-backend
  namespace: toron-test
  labels:
    app: dummy-backend
spec:
  type: ClusterIP
  selector:
    app: dummy-backend
  ports:
    - name: http
      port: 9001
      targetPort: 9001
