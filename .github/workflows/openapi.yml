name: Validate OpenAPI

on:
  push:
    branches:
      - master
    paths:
      - 'openapi/**'
      - '.github/workflows/openapi.yml'
  pull_request:
    paths:
      - 'openapi/**'
      - '.github/workflows/openapi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint OpenAPI contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install OpenAPI linter
        run: npm install --no-save --no-package-lock @redocly/cli@latest

      - name: Lint OpenAPI document
        run: npx redocly lint openapi/openapi.yaml --format github-actions

  breaking-changes:
    name: Detect OpenAPI breaking changes
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect breaking changes on pull request
        if: github.event_name == 'pull_request'
        uses: oasdiff/oasdiff-action/breaking@v0
        with:
          base: 'origin/${{ github.base_ref }}:openapi/openapi.yaml'
          revision: 'HEAD:openapi/openapi.yaml'
          fail-on: ERR
          github-token: ${{ github.token }}

      - name: Detect breaking changes on push
        if: github.event_name == 'push'
        uses: oasdiff/oasdiff-action/breaking@v0
        with:
          base: 'HEAD^:openapi/openapi.yaml'
          revision: 'HEAD:openapi/openapi.yaml'
          fail-on: ERR
          github-token: ${{ github.token }}
