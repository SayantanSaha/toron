apiVersion: v1
kind: Namespace
metadata:
  name: envoy-test
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-ingress-config
  namespace: envoy-test
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901
    static_resources:
      listeners:
      - name: listener_ingress
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 8080
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              route_config:
                name: local_route
                virtual_hosts:
                - name: local_service
                  domains: ["*"]
                  routes:
                  - match:
                      path: "/health"
                    direct_response:
                      status: 200
                      body:
                        inline_string: '{"status":"ok"}'
                  - match:
                      prefix: "/dummy/"
                    route:
                      cluster: dummy_backend
                      prefix_rewrite: "/"
                  - match:
                      path: "/dummy"
                    route:
                      cluster: dummy_backend
                      prefix_rewrite: "/"
                  - match:
                      prefix: "/sidecar/"
                    route:
                      cluster: sidecar_service
                      prefix_rewrite: "/"
                  - match:
                      path: "/sidecar"
                    route:
                      cluster: sidecar_service
                      prefix_rewrite: "/"
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: dummy_backend
        connect_timeout: 0.25s
        type: STRICT_DNS
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: dummy_backend
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: dummy-backend.envoy-test.svc.cluster.local
                    port_value: 9001
      - name: sidecar_service
        connect_timeout: 0.25s
        type: STRICT_DNS
        dns_lookup_family: V4_ONLY
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: sidecar_service
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: sidecar-service.envoy-test.svc.cluster.local
                    port_value: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-sidecar-config
  namespace: envoy-test
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 15000
    static_resources:
      listeners:
      - name: listener_sidecar
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 15006
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: sidecar_http
              route_config:
                name: sidecar_route
                virtual_hosts:
                - name: app_service
                  domains: ["*"]
                  routes:
                  - match:
                      prefix: "/"
                    route:
                      cluster: local_app
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: local_app
        connect_timeout: 0.25s
        type: STATIC
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: local_app
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummy-backend
  namespace: envoy-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dummy-backend
  template:
    metadata:
      labels:
        app: dummy-backend
    spec:
      containers:
        - name: dummy-backend
          image: dummy-services:test
          imagePullPolicy: IfNotPresent
          command: ["/app/dummy"]
          args: ["-port", "9001", "-count", "1"]
          ports:
            - containerPort: 9001
          readinessProbe:
            httpGet:
              path: /health
              port: 9001
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dummy-backend
  namespace: envoy-test
spec:
  type: ClusterIP
  selector:
    app: dummy-backend
  ports:
    - port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidecar-app
  namespace: envoy-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sidecar-app
  template:
    metadata:
      labels:
        app: sidecar-app
    spec:
      containers:
        - name: dummy-app
          image: dummy-services:test
          imagePullPolicy: IfNotPresent
          command: ["/app/dummy"]
          args: ["-port", "9001", "-count", "1"]
          ports:
            - containerPort: 9001
          readinessProbe:
            httpGet:
              path: /health
              port: 9001
            initialDelaySeconds: 2
            periodSeconds: 5
        - name: envoy-sidecar
          image: envoyproxy/envoy:v1.31-latest
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "/etc/envoy/envoy.yaml"
            - "--log-level"
            - "error"
          ports:
            - name: proxy
              containerPort: 15006
            - name: admin
              containerPort: 15000
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
      volumes:
        - name: config
          configMap:
            name: envoy-sidecar-config
---
apiVersion: v1
kind: Service
metadata:
  name: sidecar-service
  namespace: envoy-test
spec:
  type: ClusterIP
  selector:
    app: sidecar-app
  ports:
    - port: 80
      targetPort: 15006
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-sidecar-admin
  namespace: envoy-test
spec:
  type: LoadBalancer
  selector:
    app: sidecar-app
  ports:
    - name: admin
      port: 15000
      targetPort: 15000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-ingress
  namespace: envoy-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy-ingress
  template:
    metadata:
      labels:
        app: envoy-ingress
    spec:
      containers:
        - name: envoy-ingress
          image: envoyproxy/envoy:v1.31-latest
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "/etc/envoy/envoy.yaml"
            - "--log-level"
            - "error"
          ports:
            - name: http
              containerPort: 8080
            - name: admin
              containerPort: 9901
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
      volumes:
        - name: config
          configMap:
            name: envoy-ingress-config
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-ingress-service
  namespace: envoy-test
spec:
  type: LoadBalancer
  selector:
    app: envoy-ingress
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: admin
      port: 9901
      targetPort: 9901
