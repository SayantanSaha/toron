apiVersion: v1
kind: ConfigMap
metadata:
  name: toron-ingress-config
  namespace: toron-test
data:
  config.yaml: |
    server:
      port: 8080
      read_timeout: 30s
      write_timeout: 30s
      idle_timeout: 60s
      worker_pool_size: 128
      max_body_bytes: 10485760
      admin_subnets:
        - "0.0.0.0/0"
        - "::/0"
    logging:
      level: "info"
      format: "text"
    proxy:
      enabled: true
      routes: []
    ingress:
      enabled: true
      ingress_class: "toron"
      resync_period: 5s
  routes.yaml: |
    routes:
      - type: "static"
        prefix: "/internal/dashboard"
        dir: "/etc/toron/public"
