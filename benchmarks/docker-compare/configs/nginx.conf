user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;

    upstream node_upstream {
        server node-origin:9101;
        keepalive 128;
    }

    upstream python_upstream {
        server python-origin:9102;
        keepalive 128;
    }

    upstream go_upstream {
        server go-origin:9103;
        keepalive 128;
    }

    upstream fast_upstream {
        server fast-origin:9104;
        keepalive 128;
    }

    server {
        listen 80;
        server_name localhost;

        location /node/ {
            proxy_pass http://node_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /python/ {
            proxy_pass http://python_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /go/ {
            proxy_pass http://go_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /fast/ {
            proxy_pass http://fast_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health endpoint for the proxy itself
        location = /health {
            return 200 '{"status":"ok","proxy":"nginx"}';
            add_header Content-Type application/json;
        }
    }
}
