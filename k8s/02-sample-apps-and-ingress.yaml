apiVersion: v1
kind: Namespace
metadata:
  name: demo-apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service-v1
  namespace: demo-apps
  labels:
    app: user-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
      version: v1
  template:
    metadata:
      labels:
        app: user-service
        version: v1
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:latest
          args:
            - "-listen=:8080"
            - "-text=Response from User Service V1"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: user-service-v1
  namespace: demo-apps
  labels:
    app: user-service
    version: v1
spec:
  selector:
    app: user-service
    version: v1
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service-v2
  namespace: demo-apps
  labels:
    app: user-service
    version: v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
      version: v2
  template:
    metadata:
      labels:
        app: user-service
        version: v2
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:latest
          args:
            - "-listen=:8080"
            - "-text=Response from User Service V2 (Canary)"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: user-service-v2
  namespace: demo-apps
  labels:
    app: user-service
    version: v2
spec:
  selector:
    app: user-service
    version: v2
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-ingress
  namespace: demo-apps
  annotations:
    toron.io/ssl-redirect: "false"
spec:
  ingressClassName: toron
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /v1/users
            pathType: Prefix
            backend:
              service:
                name: user-service-v1
                port:
                  number: 8080
          - path: /v2/users
            pathType: Prefix
            backend:
              service:
                name: user-service-v2
                port:
                  number: 8080
