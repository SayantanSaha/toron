apiVersion: v1
kind: Namespace
metadata:
  name: traefik-test
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-ingress-config
  namespace: traefik-test
data:
  traefik.yml: |
    api:
      dashboard: true
      insecure: true
    entryPoints:
      web:
        address: ":8080"
      traefik:
        address: ":9000"
    providers:
      file:
        filename: "/etc/traefik/dynamic.yml"
    ping:
      entryPoint: "web"
    log:
      level: "ERROR"
  dynamic.yml: |
    http:
      routers:
        health:
          entryPoints: ["web"]
          rule: "Path(`/health`)"
          service: "ping@internal"
        dummy:
          entryPoints: ["web"]
          rule: "PathPrefix(`/dummy`)"
          middlewares:
            - "strip-dummy"
          service: "dummy-svc"
        sidecar:
          entryPoints: ["web"]
          rule: "PathPrefix(`/sidecar`)"
          middlewares:
            - "strip-sidecar"
          service: "sidecar-svc"
      middlewares:
        strip-dummy:
          stripPrefix:
            prefixes:
              - "/dummy"
        strip-sidecar:
          stripPrefix:
            prefixes:
              - "/sidecar"
      services:
        dummy-svc:
          loadBalancer:
            servers:
              - url: "http://dummy-backend.traefik-test.svc.cluster.local:9001"
        sidecar-svc:
          loadBalancer:
            servers:
              - url: "http://sidecar-service.traefik-test.svc.cluster.local:80"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-sidecar-config
  namespace: traefik-test
data:
  traefik.yml: |
    api:
      dashboard: true
      insecure: true
    entryPoints:
      sidecar:
        address: ":15006"
      traefik:
        address: ":9000"
    providers:
      file:
        filename: "/etc/traefik/dynamic.yml"
    log:
      level: "ERROR"
  dynamic.yml: |
    http:
      routers:
        app:
          entryPoints: ["sidecar"]
          rule: "PathPrefix(`/`)"
          service: "app-svc"
      services:
        app-svc:
          loadBalancer:
            servers:
              - url: "http://127.0.0.1:9001"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummy-backend
  namespace: traefik-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dummy-backend
  template:
    metadata:
      labels:
        app: dummy-backend
    spec:
      containers:
        - name: dummy-backend
          image: dummy-services:test
          imagePullPolicy: IfNotPresent
          command: ["/app/dummy"]
          args: ["-port", "9001", "-count", "1"]
          ports:
            - containerPort: 9001
          readinessProbe:
            httpGet:
              path: /health
              port: 9001
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dummy-backend
  namespace: traefik-test
spec:
  type: ClusterIP
  selector:
    app: dummy-backend
  ports:
    - port: 9001
      targetPort: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidecar-app
  namespace: traefik-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sidecar-app
  template:
    metadata:
      labels:
        app: sidecar-app
    spec:
      containers:
        - name: dummy-app
          image: dummy-services:test
          imagePullPolicy: IfNotPresent
          command: ["/app/dummy"]
          args: ["-port", "9001", "-count", "1"]
          ports:
            - containerPort: 9001
          readinessProbe:
            httpGet:
              path: /health
              port: 9001
            initialDelaySeconds: 2
            periodSeconds: 5
        - name: traefik-sidecar
          image: traefik:v3.1
          imagePullPolicy: IfNotPresent
          args:
            - "--configFile=/etc/traefik/traefik.yml"
          ports:
            - name: sidecar
              containerPort: 15006
            - name: dashboard
              containerPort: 9000
          volumeMounts:
            - name: config
              mountPath: /etc/traefik
      volumes:
        - name: config
          configMap:
            name: traefik-sidecar-config
---
apiVersion: v1
kind: Service
metadata:
  name: sidecar-service
  namespace: traefik-test
spec:
  type: ClusterIP
  selector:
    app: sidecar-app
  ports:
    - name: http
      port: 80
      targetPort: 15006
---
apiVersion: v1
kind: Service
metadata:
  name: traefik-sidecar-dashboard
  namespace: traefik-test
spec:
  type: LoadBalancer
  selector:
    app: sidecar-app
  ports:
    - name: dashboard
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik-ingress
  namespace: traefik-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik-ingress
  template:
    metadata:
      labels:
        app: traefik-ingress
    spec:
      containers:
        - name: traefik-ingress
          image: traefik:v3.1
          imagePullPolicy: IfNotPresent
          args:
            - "--configFile=/etc/traefik/traefik.yml"
          ports:
            - name: web
              containerPort: 8080
            - name: dashboard
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/traefik
      volumes:
        - name: config
          configMap:
            name: traefik-ingress-config
---
apiVersion: v1
kind: Service
metadata:
  name: traefik-ingress-service
  namespace: traefik-test
spec:
  type: LoadBalancer
  selector:
    app: traefik-ingress
  ports:
    - name: web
      port: 8080
      targetPort: 8080
    - name: dashboard
      port: 9000
      targetPort: 9000
