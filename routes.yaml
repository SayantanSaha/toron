# Toron Web Server Routing Configuration File (Static Sites & Upstream Reverse Proxies)

routes:
  # 1. Static Site Route - Control Center & Dashboard UI
  - type: "static"
    prefix: "/internal/dashboard"
    dir: "./public"

  # 2. Domain-Based Upstream Routing (Host: api.toron.local -> Dummy Services 1, 4, 6)
  - type: "upstream"
    host: "api.toron.local"
    prefix: "/"
    algorithm: "round_robin"
    targets:
      - "http://localhost:9001"
      - "http://localhost:9004"
      - "http://localhost:9006"

  # 3. Header-Based Upstream Routing + Multi-Target Round-Robin Load Balancing
  - type: "upstream"
    prefix: "/api"
    headers:
      X-Version: "v2"
    algorithm: "round_robin"
    targets:
      - "http://localhost:9001"
      - "http://localhost:9002"
      - "http://localhost:9003"

  # 4. Header-Based Upstream Routing + Single Target
  - type: "upstream"
    prefix: "/api"
    headers:
      X-Version: "v1"
    target: "http://localhost:9004"

  # 5. Path Prefix Upstream Routing + Multi-Target Round-Robin Load Balancing
  - type: "upstream"
    prefix: "/services/cluster"
    algorithm: "round_robin"
    targets:
      - "http://localhost:9005"
      - "http://localhost:9006"
      - "http://localhost:9007"

  # 6. Path Prefix Upstream Routing + Single Target
  - type: "upstream"
    prefix: "/services/auth"
    target: "http://localhost:9008"

  # 7. Path Prefix Upstream Routing + Multi-Target Load Balancing
  - type: "upstream"
    prefix: "/services/analytics"
    algorithm: "round_robin"
    targets:
      - "http://localhost:9009"
      - "http://localhost:9010"
