apiVersion: v1
kind: ConfigMap
metadata:
  name: toron-sidecar-config
  namespace: toron-test
data:
  config.yaml: |
    server:
      port: 8081
      read_timeout: 30s
      write_timeout: 30s
      idle_timeout: 60s
      worker_pool_size: 64
      max_body_bytes: 10485760
      admin_subnets:
        - "0.0.0.0/0"
        - "::/0"
    logging:
      level: "info"
      format: "text"
    proxy:
      enabled: true
      routes: []
    sidecar:
      enabled: true
      mode: "ingress"
      ingress_port: 15006
      app_port: 9001
      strict_mtls: false
  routes.yaml: |
    routes:
      - type: "static"
        prefix: "/internal/dashboard"
        dir: "/etc/toron/public"
