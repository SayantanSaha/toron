apiVersion: v1
kind: Namespace
metadata:
  name: toron-test
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: toron-ingress-controller
  namespace: toron-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: toron-ingress-role
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: toron-ingress-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: toron-ingress-role
subjects:
  - kind: ServiceAccount
    name: toron-ingress-controller
    namespace: toron-test
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: toron-ingress-config
  namespace: toron-test
data:
  config.yaml: |
    server:
      port: 8080
      read_timeout: 30s
      write_timeout: 30s
      idle_timeout: 60s
      worker_pool_size: 128
      max_body_bytes: 10485760
      admin_subnets:
        - "0.0.0.0/0"
        - "::/0"
    logging:
      level: "info"
      format: "text"
    proxy:
      enabled: true
      routes: []
    ingress:
      enabled: true
      ingress_class: "toron"
      resync_period: 5s
  routes.yaml: |
    routes:
      - type: "static"
        prefix: "/internal/dashboard"
        dir: "/etc/toron/public"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toron-ingress-controller
  namespace: toron-test
  labels:
    app: toron-ingress-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: toron-ingress-controller
  template:
    metadata:
      labels:
        app: toron-ingress-controller
    spec:
      serviceAccountName: toron-ingress-controller
      containers:
        - name: toron-ingress-controller
          image: toron:test
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/toron
            - -config
            - /etc/toron-config/config.yaml
            - -routes
            - /etc/toron-config/routes.yaml
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: config-volume
              mountPath: /etc/toron-config
      volumes:
        - name: config-volume
          configMap:
            name: toron-ingress-config
---
apiVersion: v1
kind: Service
metadata:
  name: toron-ingress-service
  namespace: toron-test
  labels:
    app: toron-ingress-controller
spec:
  type: LoadBalancer
  selector:
    app: toron-ingress-controller
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: toron-sidecar-config
  namespace: toron-test
data:
  config.yaml: |
    server:
      port: 8081
      read_timeout: 30s
      write_timeout: 30s
      idle_timeout: 60s
      worker_pool_size: 64
      max_body_bytes: 10485760
      admin_subnets:
        - "0.0.0.0/0"
        - "::/0"
    logging:
      level: "info"
      format: "text"
    proxy:
      enabled: true
      routes: []
    sidecar:
      enabled: true
      mode: "ingress"
      ingress_port: 15006
      app_port: 9001
      strict_mtls: false
  routes.yaml: |
    routes:
      - type: "static"
        prefix: "/internal/dashboard"
        dir: "/etc/toron/public"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidecar-app
  namespace: toron-test
  labels:
    app: sidecar-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sidecar-app
  template:
    metadata:
      labels:
        app: sidecar-app
    spec:
      containers:
        - name: dummy-app
          image: dummy-services:test
          imagePullPolicy: IfNotPresent
          command: ["/app/dummy"]
          args: ["-port", "9001", "-count", "1"]
          ports:
            - name: http-app
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /health
              port: 9001
            initialDelaySeconds: 2
            periodSeconds: 5
        - name: toron-sidecar
          image: toron:test
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/toron
            - -config
            - /etc/toron-config/config.yaml
            - -routes
            - /etc/toron-config/routes.yaml
          ports:
            - name: sidecar-ingress
              containerPort: 15006
            - name: sidecar-admin
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: config-volume
              mountPath: /etc/toron-config
      volumes:
        - name: config-volume
          configMap:
            name: toron-sidecar-config
---
apiVersion: v1
kind: Service
metadata:
  name: sidecar-service
  namespace: toron-test
  labels:
    app: sidecar-app
spec:
  type: ClusterIP
  selector:
    app: sidecar-app
  ports:
    - name: http
      port: 80
      targetPort: 15006
---
apiVersion: v1
kind: Service
metadata:
  name: toron-sidecar-dashboard
  namespace: toron-test
  labels:
    app: sidecar-app
spec:
  type: LoadBalancer
  selector:
    app: sidecar-app
  ports:
    - name: dashboard
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dummy-backend
  namespace: toron-test
  labels:
    app: dummy-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dummy-backend
  template:
    metadata:
      labels:
        app: dummy-backend
    spec:
      containers:
        - name: dummy-backend
          image: dummy-services:test
          imagePullPolicy: IfNotPresent
          command: ["/app/dummy"]
          args: ["-port", "9001", "-count", "1"]
          ports:
            - name: http
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /health
              port: 9001
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dummy-backend
  namespace: toron-test
  labels:
    app: dummy-backend
spec:
  type: ClusterIP
  selector:
    app: dummy-backend
  ports:
    - name: http
      port: 9001
      targetPort: 9001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: toron-ingress
  namespace: toron-test
  annotations:
    toron.io/health-check: "/health"
    toron.io/health-check-interval: "5s"
spec:
  ingressClassName: toron
  rules:
    - http:
        paths:
          - path: /dummy
            pathType: Prefix
            backend:
              service:
                name: dummy-backend
                port:
                  number: 9001
          - path: /sidecar
            pathType: Prefix
            backend:
              service:
                name: sidecar-service
                port:
                  number: 80
