# Toron Multi-Hop Evaluation Infrastructure Configuration
server:
  host: "0.0.0.0"
  port: 8080
  worker_pool_size: 128
  read_timeout: 5s
  write_timeout: 5s
  idle_timeout: 30s
  max_header_bytes: 8192
  max_body_bytes: 4194304

  http2:
    enabled: true
    max_concurrent_streams: 250
    max_frame_size: 16384
    allow_h2c: true

  compression:
    enabled: false

  cache:
    enabled: false

  waf:
    enabled: true
    mode: "enforce"
    anomaly_threshold: 5
    max_inspect_body_size: 65536

logging:
  level: "info"
  format: "text"
  server_log: "stdout"
