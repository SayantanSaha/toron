# Toron Web Server Reverse Proxy & Routing Configuration File

proxy:
  enabled: true
  routes:
    # 1. Domain-Based Routing (Host: api.toron.local -> Dummy Services 1, 2, 3)
    - host: "api.toron.local"
      prefix: "/"
      algorithm: "round_robin"
      targets:
        - "http://localhost:9001"
        - "http://localhost:9004"
        - "http://localhost:9006"

    # 2. Header-Based Routing + Multi-Target Round-Robin Load Balancing (Dummy Services 1, 2, 3)
    - prefix: "/api"
      headers:
        X-Version: "v2"
      algorithm: "round_robin"
      targets:
        - "http://localhost:9001"
        - "http://localhost:9002"
        - "http://localhost:9003"

    # 3. Header-Based Routing + Single Target (Dummy Service 4)
    - prefix: "/api"
      headers:
        X-Version: "v1"
      target: "http://localhost:9004"

    # 4. Path Prefix Routing + Multi-Target Round-Robin Load Balancing (Dummy Services 5, 6, 7)
    - prefix: "/services/cluster"
      algorithm: "round_robin"
      targets:
        - "http://localhost:9005"
        - "http://localhost:9006"
        - "http://localhost:9007"

    # 5. Path Prefix Routing + Single Target (Dummy Service 8)
    - prefix: "/services/auth"
      target: "http://localhost:9008"

    # 6. Path Prefix Routing + Multi-Target Load Balancing (Dummy Services 9, 10)
    - prefix: "/services/analytics"
      algorithm: "round_robin"
      targets:
        - "http://localhost:9009"
        - "http://localhost:9010"
