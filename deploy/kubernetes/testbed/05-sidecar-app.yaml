apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidecar-app
  namespace: toron-test
  labels:
    app: sidecar-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sidecar-app
  template:
    metadata:
      labels:
        app: sidecar-app
    spec:
      containers:
        - name: dummy-app
          image: dummy-services:test
          imagePullPolicy: IfNotPresent
          command: ["/app/dummy"]
          args: ["-port", "9001", "-count", "1"]
          ports:
            - name: http-app
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /health
              port: 9001
            initialDelaySeconds: 2
            periodSeconds: 5
        - name: toron-sidecar
          image: toron:test
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/toron
            - -config
            - /etc/toron-config/config.yaml
            - -routes
            - /etc/toron-config/routes.yaml
          ports:
            - name: sidecar-ingress
              containerPort: 15006
            - name: sidecar-admin
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: config-volume
              mountPath: /etc/toron-config
      volumes:
        - name: config-volume
          configMap:
            name: toron-sidecar-config
---
apiVersion: v1
kind: Service
metadata:
  name: sidecar-service
  namespace: toron-test
  labels:
    app: sidecar-app
spec:
  type: ClusterIP
  selector:
    app: sidecar-app
  ports:
    - name: http
      port: 80
      targetPort: 15006
---
apiVersion: v1
kind: Service
metadata:
  name: toron-sidecar-dashboard
  namespace: toron-test
  labels:
    app: sidecar-app
spec:
  type: LoadBalancer
  selector:
    app: sidecar-app
  ports:
    - name: dashboard
      port: 8081
      targetPort: 8081
