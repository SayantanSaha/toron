# Toron Web Server Infrastructure Configuration File

server:
  host: "0.0.0.0"
  port: 8080
  worker_pool_size: 128
  read_timeout: 5s
  write_timeout: 5s
  idle_timeout: 30s
  max_header_bytes: 8192      # 8 KB
  max_body_bytes: 4194304     # 4 MB
  http2:
    enabled: true
    max_concurrent_streams: 250
    max_frame_size: 16384
    allow_h2c: true

static:
  enabled: true
  prefix: "/internal/dashboard/"
  dir: "./public"

logging:
  level: "info"
  format: "text"
